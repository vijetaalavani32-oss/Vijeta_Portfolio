  <g fill="#22d3ee">
    <circle cx="90" cy="330" r="6"/>
    <circle cx="140" cy="285" r="6"/>
    <circle cx="190" cy="305" r="6"/>
    <circle cx="240" cy="230" r="6"/>
    <circle cx="290" cy="255" r="6"/>
