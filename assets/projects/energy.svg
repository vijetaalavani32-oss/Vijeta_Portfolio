    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="24" fill="url(#bg)"/>

  <text x="45" y="58" fill="#ffffff" font-size="27"
